<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MBTI 추리 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --border: rgba(0,0,0,0.22);
    --border-strong: rgba(0,0,0,0.55);
    --text:#000000;
    --text-dim: rgba(0,0,0,0.55);
    --accent:#000000;
    --accent-dim: rgba(0,0,0,0.05);
    --option-b:#000000;
    --option-b-dim: rgba(0,0,0,0.05);
    --pass: rgba(0,0,0,0.30);
    --danger:#000000;
    --radius:8px;
    --shadow: 3px 3px 0 #000;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono','Pretendard',monospace;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{ max-width:560px; margin:0 auto; padding:22px 16px 60px; }

  header{ margin-bottom:20px; border-bottom:2px solid #000; padding-bottom:14px; }
  .eyebrow{
    font-size:12px; letter-spacing:0.16em; color:var(--text);
    text-transform:uppercase; margin-bottom:6px; font-weight:700;
  }
  h1{
    font-family:'Bebas Neue','Pretendard',sans-serif;
    font-size:30px; letter-spacing:0.01em; line-height:1; font-weight:400;
    margin:0 0 9px; color:var(--text);
  }
  .sub{ font-size:14.5px; color:var(--text-dim); line-height:1.65; }

  .card{
    background:var(--surface); border:1.5px solid #000;
    border-radius:var(--radius); padding:20px 18px; margin-bottom:16px;
    box-shadow:var(--shadow);
  }

  .name-list{ display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto; }
  .name-row{ display:flex; align-items:stretch; gap:7px; }
  .star-btn{
    flex:0 0 46px; background:#fff; border:1.5px solid #000;
    border-radius:8px; font-size:20px; color:var(--pass); cursor:pointer; min-height:48px;
  }
  .star-btn.active{ color:#000; }
  .name-btn2{
    flex:1; background:#fff; border:1.5px solid #000; border-radius:8px;
    padding:12px 14px; font-size:16px; font-weight:500; color:var(--text); text-align:left;
    cursor:pointer; min-height:48px; font-family:'JetBrains Mono','Pretendard',monospace;
  }
  .name-btn2:hover{ background:#000; color:#fff; }
  .name-btn2.starred{ background:#000; color:#fff; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
  .field input{
    width:100%; background:#fff; border:1.5px solid #000;
    color:var(--text); padding:13px 14px; border-radius:8px;
    font-family:'JetBrains Mono','Pretendard',monospace; font-size:16px; min-height:48px;
  }
  .field input:focus{ outline:none; border-color:#000; box-shadow:0 0 0 2px rgba(0,0,0,0.15); }
  .field .hint{ font-size:11.5px; color:var(--text-dim); margin-top:6px; line-height:1.5; }

  .member-name{
    font-family:'Bebas Neue','Pretendard',sans-serif;
    font-size:26px; letter-spacing:0.01em; margin-bottom:14px; font-weight:400;
  }
  .axis-row{ margin-bottom:6px; }
  .axis-row:last-child{ margin-bottom:0; }
  .opt-group{ display:flex; gap:6px; }
  .opt-btn{
    flex:1; background:#fff; border:1.5px solid #000;
    color:var(--text); font-family:'JetBrains Mono','Pretendard',monospace;
    font-size:14.5px; font-weight:700; padding:9px 4px; border-radius:7px;
    cursor:pointer; transition:.1s; text-align:center; min-height:38px;
  }
  .opt-btn:active{ transform:scale(0.97); }
  .opt-btn:disabled{
    cursor:not-allowed;
    background-image: repeating-linear-gradient(45deg, rgba(220,38,38,0.75) 0 1.5px, transparent 1.5px 6px);
  }
  .opt-btn.sel-a.active{ background:#000; border-color:#000; color:#fff; }
  .opt-btn.sel-b.active{ background:#000; border-color:#000; color:#fff; }
  .opt-btn.sel-a.active:disabled, .opt-btn.sel-b.active:disabled{
    background-color:#000; border-color:#000; color:#fff;
    background-image: repeating-linear-gradient(45deg, rgba(220,38,38,0.75) 0 1.5px, transparent 1.5px 6px);
  }
  .opt-btn.pass{ flex:0.7; font-size:13px; font-weight:600; }

  .jump-bar{ position:sticky; top:0; z-index:10; background:var(--bg); padding:8px 0; margin-bottom:10px; }
  .jump-bar select{
    width:100%; background:#fff; border:1.5px solid #000; color:var(--text);
    padding:10px 12px; border-radius:8px; font-family:'JetBrains Mono','Pretendard',monospace;
    font-size:14px; font-weight:600; min-height:42px;
  }

  .vote-card{
    background:var(--surface); border:1.5px solid #000;
    border-radius:8px; padding:10px 10px; margin-bottom:8px;
    box-shadow: 2px 2px 0 #000;
  }
  .vote-name{ font-size:15px; font-weight:600; }
  .vote-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; border-bottom:1.5px solid #000; padding-bottom:6px; }
  .memo-toggle-btn{
    background:none; border:1.5px solid #000; color:var(--text); font-size:11.5px;
    padding:5px 9px; border-radius:6px; cursor:pointer;
  }
  .memo-toggle-btn.has-memo{ background:#000; color:#fff; }
  .mini-axis-row{ display:flex; gap:5px; }
  .mini-axis-group{
    flex:1; display:flex; border:1.5px solid #000; border-radius:7px; overflow:hidden;
  }
  .mini-btn{
    flex:1; background:#fff; border:none; color:var(--text);
    font-family:'JetBrains Mono','Pretendard',monospace; font-size:13.5px; font-weight:700;
    padding:10px 2px; cursor:pointer; text-align:center; min-height:40px;
  }
  .mini-btn.sel-a.active{ background:#000; color:#fff; }
  .mini-btn.sel-b.active{ background:#000; color:#fff; }
  .memo-box{
    width:100%; margin-top:6px; background:#fff; border:1.5px solid #000;
    border-radius:7px; padding:7px 9px; font-family:'JetBrains Mono','Pretendard',monospace;
    font-size:13px; color:var(--text); resize:vertical; min-height:38px;
  }
  .memo-box:focus{ outline:none; box-shadow:0 0 0 2px rgba(0,0,0,0.15); }
  .top-info{ font-size:13.5px; color:var(--text-dim); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .top-info b{ color:var(--text); }
  .switch-link{ font-size:12.5px; color:var(--text); background:none; border:none; cursor:pointer; text-decoration:underline; padding:4px; }

  .submit-bar{ position:sticky; bottom:0; padding-top:14px; margin-top:6px;
    background:linear-gradient(transparent, var(--bg) 35%); }
  .btn{
    width:100%; background:#000; color:#fff; border:1.5px solid #000;
    font-family:'Bebas Neue','Pretendard',sans-serif; font-size:21px; letter-spacing:0.03em;
    padding:16px; border-radius:var(--radius); cursor:pointer; transition:.15s; min-height:54px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.35);
  }
  .btn:hover{ filter:brightness(1.15); }
  .btn:disabled{ background:#fff; color:rgba(0,0,0,0.35); border-color:rgba(0,0,0,0.25); box-shadow:none; cursor:default; }
  .btn.outline{ background:#fff; border:1.5px solid #000; color:var(--text); font-size:15px; padding:12px; min-height:46px; box-shadow:none; }
  .btn.danger{ background:#fff; border:1.5px dashed #000; color:var(--text); font-size:13px; padding:11px; min-height:44px; box-shadow:none; }

  .center-msg{ text-align:center; padding:36px 16px; }
  .center-msg .big{ font-family:'Bebas Neue','Pretendard',sans-serif; font-size:28px; color:var(--text); margin-bottom:8px; }
  .center-msg p{ font-size:14px; color:var(--text-dim); margin:0; line-height:1.65; }

  .admin-link{
    text-align:center; font-size:12.5px;
    color:var(--text-dim); background:none; border:none; cursor:pointer;
    text-decoration:underline; padding:10px;
  }
  .admin-link-row{ margin:24px auto 0; }

  nav.admin-tabs{ display:flex; gap:0; margin-bottom:16px; border:1.5px solid #000; border-radius:8px; overflow:hidden; }
  nav.admin-tabs button{
    flex:1; background:#fff; color:var(--text); border:none; border-right:1.5px solid #000;
    padding:13px 4px; font-family:'JetBrains Mono','Pretendard',monospace; font-size:14px;
    cursor:pointer; min-height:46px; font-weight:600;
  }
  nav.admin-tabs button:last-child{ border-right:none; }
  nav.admin-tabs button.active{ background:#000; color:#fff; font-weight:700; }

  .settings-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; background:#fff; border:1.5px solid #000;
    border-radius:8px; margin-bottom:7px; font-size:15px;
  }
  .settings-item button{
    background:none; border:1px solid #000; border-radius:6px; color:var(--text); cursor:pointer; font-size:12.5px;
    font-family:'JetBrains Mono','Pretendard',monospace; padding:6px 9px; font-weight:600;
  }
  .lockToggleBtn.locked{ background:#000; color:#fff; }
  .add-row{ display:flex; gap:7px; margin-bottom:18px; }
  .add-row input{ flex:1; }
  .add-row button{
    background:#000; border:1.5px solid #000; color:#fff; padding:0 18px;
    border-radius:8px; font-weight:700; cursor:pointer; font-size:14px;
  }
  .divider{ border:none; border-top:1.5px solid #000; margin:20px 0; }

  .result-axis{ margin-bottom:15px; }
  .result-labels{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; font-weight:700; }
  .result-labels .a{ color:var(--text); }
  .result-labels .b{ color:#2F6FED; }
  .bar{ height:14px; border-radius:6px; overflow:hidden; display:flex; background:#fff; border:1.5px solid #000; }
  .bar .fill-a{ background:#000; }
  .bar .fill-b{ background:#2F6FED; }
  .result-meta{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin-top:5px; }
  .voter-count{ font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }

  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:#000; color:#fff; padding:12px 20px; border-radius:8px;
    font-size:13.5px; opacity:0; transition:.25s; pointer-events:none; z-index:50;
    max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; }
  .note{ font-size:12px; color:var(--text-dim); line-height:1.65; margin-top:9px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const AXES = [
  { key:'EI', a:'I', b:'E' },
  { key:'SN', a:'S', b:'N' },
  { key:'TF', a:'T', b:'F' },
  { key:'PJ', a:'P', b:'J' },
];
const API = '/api';

// 초성 검색 지원 (예: "ㄱ" 입력 시 "겸", "가나다", "금자" 등 매칭)
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChosung(str){
  return [...str].map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if(code < 0 || code > 11171) return ch;
    return CHOSUNG[Math.floor(code / 588)];
  }).join('');
}
function matchesQuery(name, query){
  if(!query) return true;
  return name.includes(query) || toChosung(name).includes(query);
}

let session = JSON.parse(localStorage.getItem('mbti_session') || 'null'); // {name, password}
let members = [];
let selections = {};
let voteFilterQuery = '';
let lockedAxesMap = {}; // { memberName: {EI:bool, SN:bool, TF:bool, PJ:bool} }
let adminPassword = null;
let adminTab = 'members';
let nameFilter = '';

async function api(action, payload){
  const res = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getStarred(){ return JSON.parse(localStorage.getItem('starred_members') || '[]'); }
function toggleStar(name){
  let s = getStarred();
  if(s.includes(name)) s = s.filter(n => n !== name);
  else s.push(name);
  localStorage.setItem('starred_members', JSON.stringify(s));
}

function baseHeader(){
  return `<header>
    <h1>YCC MBTI VOTE</h1>
  </header>`;
}
function adminLinkHtml(){
  return `<div class="admin-link-row" style="display:flex; justify-content:center; gap:10px; align-items:center;">
    <button class="admin-link" id="adminLinkBtn">관리자 로그인</button>
    ${session ? `<span style="color:var(--border-strong);">·</span><button class="admin-link" id="userLogoutBtn">로그아웃</button>` : ''}
  </div>`;
}
function bindAdminLink(){
  const b = document.getElementById('adminLinkBtn');
  if(b) b.addEventListener('click', renderAdminLogin);
  const lo = document.getElementById('userLogoutBtn');
  if(lo) lo.addEventListener('click', () => {
    localStorage.removeItem('mbti_session');
    session = null;
    selections = {};
    renderMemberList();
  });
}

// ============ 라우팅 ============
function sortMembersKo(list){
  return list.slice().sort((a,b) => a.localeCompare(b, 'ko'));
}
async function render(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="center-msg"><p>불러오는 중...</p></div>`;
  const pub = await api('public', {});
  if(pub.error){
    const cached = localStorage.getItem('mbti_members_cache');
    if(session && session.name && session.password && cached){
      // 일시적 오류: 로그인 세션은 유지하고, 직전에 캐시해둔 멤버 목록으로 우선 진행
      members = sortMembersKo(JSON.parse(cached));
      await loginAndRenderVote(session.name, session.password, true);
      return;
    }
    app.innerHTML = baseHeader() + `<div class="card center-msg"><p>오류: ${esc(pub.error)}</p></div>` + adminLinkHtml();
    bindAdminLink();
    return;
  }
  members = sortMembersKo(pub.members || []);
  localStorage.setItem('mbti_members_cache', JSON.stringify(members));
  const lockRes = await api('lockedAxes', {});
  lockedAxesMap = (lockRes && lockRes.locks) || {};

  if(session && session.name && session.password){
    await loginAndRenderVote(session.name, session.password, true);
  } else {
    renderMemberList();
  }
}

// ============ 홈: 멤버 목록 (별 즐겨찾기) ============
function renderMemberList(){
  const app = document.getElementById('app');
  if(members.length === 0){
    app.innerHTML = baseHeader() + `<div class="card center-msg"><p>아직 등록된 멤버가 없어요.<br>관리자에게 문의해주세요.</p></div>` + adminLinkHtml();
    bindAdminLink();
    return;
  }
  const starred = getStarred();
  let list = members.filter(n => matchesQuery(n, nameFilter));
  list.sort((a,b) => {
    const sa = starred.includes(a) ? 0 : 1;
    const sb = starred.includes(b) ? 0 : 1;
    if(sa !== sb) return sa - sb;
    return members.indexOf(a) - members.indexOf(b);
  });

  let html = baseHeader() + `<div class="sub" style="margin-bottom:14px;">본인의 닉네임을 눌러 로그인해 주세요.</div><div class="card">
    <input type="text" id="nameFilterInput" placeholder="이름 검색..." value="${esc(nameFilter)}" style="width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:12px 14px; border-radius:8px; font-family:'JetBrains Mono','Pretendard',monospace; font-size:15px; margin-bottom:12px; min-height:46px;">
    <div class="name-list">`;
  if(list.length === 0){
    html += `<div class="note">검색 결과가 없어요.</div>`;
  } else {
    list.forEach(name => {
      const isStar = starred.includes(name);
      html += `<div class="name-row">
        <button class="star-btn ${isStar?'active':''}" data-name="${esc(name)}">${isStar ? '★' : '☆'}</button>
        <button class="name-btn2 ${isStar?'starred':''}" data-name="${esc(name)}">${esc(name)}</button>
      </div>`;
    });
  }
  html += `</div></div>` + adminLinkHtml();
  app.innerHTML = html;

  const filterInput = document.getElementById('nameFilterInput');
  filterInput.addEventListener('input', () => { nameFilter = filterInput.value; renderMemberList(); document.getElementById('nameFilterInput').focus(); });
  // 커서 위치를 끝으로 유지
  filterInput.setSelectionRange(filterInput.value.length, filterInput.value.length);

  app.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); toggleStar(btn.dataset.name); renderMemberList(); });
  });
  app.querySelectorAll('.name-btn2').forEach(btn => {
    btn.addEventListener('click', () => renderMemberAuth(btn.dataset.name));
  });
  bindAdminLink();
}

// ============ 개별 멤버 비밀번호 화면 ============
function renderMemberAuth(name){
  const app = document.getElementById('app');
  app.innerHTML = baseHeader() + `<div class="card">
    <div class="member-name" style="font-size:24px;">${esc(name)}</div>
    <div class="field">
      <label>비밀번호</label>
      <div style="position:relative;">
        <input type="password" id="loginPw" placeholder="첫 입력 시 비밀번호 생성" autocomplete="new-password" style="padding-right:52px;">
        <button type="button" id="togglePw" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; padding:6px;">보기</button>
      </div>
    </div>
    <button class="btn" id="loginBtn">입장하기</button>
    <button class="btn outline" id="backBtn" style="margin-top:10px;">목록으로 돌아가기</button>
  </div>`;

  document.getElementById('backBtn').addEventListener('click', renderMemberList);
  document.getElementById('togglePw').addEventListener('click', () => {
    const pwInput = document.getElementById('loginPw');
    const btn = document.getElementById('togglePw');
    if(pwInput.type === 'password'){ pwInput.type = 'text'; btn.textContent = '숨기기'; }
    else { pwInput.type = 'password'; btn.textContent = '보기'; }
  });
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const pw = document.getElementById('loginPw').value;
    if(!pw){ showToast('비밀번호를 입력해주세요'); return; }
    await loginAndRenderVote(name, pw, false);
  });
}

async function loginAndRenderVote(name, password, silent){
  const r = await api('memberAuth', { name, password });
  if(!r.success){
    const isAuthFailure = r.error === 'wrong password' || r.error === 'invalid member';
    if(isAuthFailure){
      if(!silent) showToast('비밀번호가 올바르지 않아요');
      else { localStorage.removeItem('mbti_session'); renderMemberList(); }
      return;
    }
    // 서버/네트워크 일시 오류: 로그인 정보(localStorage)는 그대로 유지하고 재시도 옵션만 보여줌
    const app = document.getElementById('app');
    app.innerHTML = baseHeader() + `<div class="card center-msg">
      <p>일시적인 오류가 발생했어요.<br>${esc(r.error || '연결에 실패했어요')}</p>
      <button class="btn outline" id="retryLoginBtn" style="margin-top:12px;">다시 시도</button>
    </div>` + adminLinkHtml();
    document.getElementById('retryLoginBtn').addEventListener('click', () => loginAndRenderVote(name, password, silent));
    bindAdminLink();
    return;
  }
  session = { name, password };
  localStorage.setItem('mbti_session', JSON.stringify(session));
  selections = r.selections || {};
  renderVote(r.isNew);
}

// ============ 투표 화면 ============
function memoKey(voterName, targetName){
  return 'memo_' + encodeURIComponent(voterName) + '_' + encodeURIComponent(targetName);
}
function getMemo(voterName, targetName){
  return localStorage.getItem(memoKey(voterName, targetName)) || '';
}
function setMemo(voterName, targetName, text){
  if(text) localStorage.setItem(memoKey(voterName, targetName), text);
  else localStorage.removeItem(memoKey(voterName, targetName));
}

function renderVote(isNew){
  const app = document.getElementById('app');
  let html = baseHeader() + `<div class="top-info">
    <span>투표자: <b>${esc(session.name)}</b>${isNew ? ' (신규)' : ''}</span>
  </div>
  <div class="jump-bar">
    <input type="text" id="voteFilterInput" placeholder="이름 검색..." value="${esc(voteFilterQuery)}" style="width:100%; background:#fff; border:1.5px solid #000; color:var(--text); padding:10px 12px; border-radius:8px; font-family:'JetBrains Mono','Pretendard',monospace; font-size:14px; min-height:42px;">
  </div>`;
  members.forEach(name => {
    if(!selections[name]) selections[name] = {};
    const locks = lockedAxesMap[name] || {};
    html += `<div class="vote-card" data-name="${esc(name)}">
      <div class="vote-head"><span class="vote-name">${esc(name)}</span></div>`;
    AXES.forEach(ax => {
      const sel = selections[name][ax.key];
      const isLocked = !!locks[ax.key];
      html += `<div class="axis-row"><div class="opt-group">
        <button class="opt-btn sel-a ${sel===ax.a?'active':''}" ${isLocked?'disabled':''} title="${isLocked?'고정되어 더 이상 수정할 수 없어요':''}" data-name="${esc(name)}" data-axis="${ax.key}" data-val="${ax.a}">${ax.a}</button>
        <button class="opt-btn sel-b ${sel===ax.b?'active':''}" ${isLocked?'disabled':''} title="${isLocked?'고정되어 더 이상 수정할 수 없어요':''}" data-name="${esc(name)}" data-axis="${ax.key}" data-val="${ax.b}">${ax.b}</button>
      </div></div>`;
    });
    html += `<textarea class="memo-box" data-name="${esc(name)}" placeholder="메모(리더 열람 불가)">${esc(getMemo(session.name, name))}</textarea>
    </div>`;
  });
  html += `<div class="submit-bar"><button class="btn" id="saveBtn">투표 저장하기</button></div>` + adminLinkHtml();
  app.innerHTML = html;

  function applyVoteFilter(){
    app.querySelectorAll('.vote-card').forEach(card => {
      card.style.display = matchesQuery(card.dataset.name, voteFilterQuery) ? '' : 'none';
    });
  }
  applyVoteFilter();

  const filterInput = document.getElementById('voteFilterInput');
  filterInput.addEventListener('input', (e) => {
    voteFilterQuery = e.target.value.trim();
    applyVoteFilter();
  });
  app.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const { name, axis, val } = btn.dataset;
      if(!selections[name]) selections[name] = {};
      selections[name][axis] = (selections[name][axis] === val) ? undefined : val;
      renderVote(false);
    });
  });
  app.querySelectorAll('.memo-box').forEach(box => {
    box.addEventListener('input', () => { setMemo(session.name, box.dataset.name, box.value.trim()); });
  });
  document.getElementById('saveBtn').addEventListener('click', saveVote);
  bindAdminLink();
}

}

// ============ 관리자 대시보드 ============
let answerDrafts = {}; // token -> {EI,SN,TF,PJ}

function axisPickerHtml(token, current){
  let html = '';
  AXES.forEach(ax => {
    const val = (current && current[ax.key]) || (answerDrafts[token] && answerDrafts[token][ax.key]);
    html += `<div class="axis-row"><div class="opt-group">
      <button class="opt-btn sel-a ${val===ax.a?'active':''}" data-token="${token}" data-axis="${ax.key}" data-val="${ax.a}">${ax.a}</button>
      <button class="opt-btn sel-b ${val===ax.b?'active':''}" data-token="${token}" data-axis="${ax.key}" data-val="${ax.b}">${ax.b}</button>
    </div></div>`;
  });
  return html;
}
function bindAxisPicker(container, token, initial){
  if(!answerDrafts[token]) answerDrafts[token] = Object.assign({}, initial || {});
  container.querySelectorAll(`.opt-btn[data-token="${token}"]`).forEach(btn => {
    btn.addEventListener('click', () => {
      answerDrafts[token][btn.dataset.axis] = btn.dataset.val;
      container.querySelectorAll(`.opt-btn[data-token="${token}"][data-axis="${btn.dataset.axis}"]`)
        .forEach(b => b.classList.toggle('active', b === btn));
    });
  });
}
function answerLabel(answer){
  if(!answer) return '미설정';
  const s = AXES.map(ax => answer[ax.key] || null);
  if(s.some(v => !v)) return '미설정';
  return s.join('');
}

// ---- 투표 결과 (실명 + 정답 대조) ----
async function renderAdminVoteLog(){
  const body = document.getElementById('adminBody');
  const r = await api('adminVoteLog', { password: adminPassword });
  if(r.error){ body.innerHTML = `<div class="center-msg"><p>오류: ${esc(r.error)}</p></div>`; return; }
  const targets = r.members; // [{name, answer, hasPassword, selections}]
  const raters = targets.filter(m => m.hasPassword);
  if(raters.length === 0){ body.innerHTML = `<div class="center-msg"><p>아직 투표한 사람이 없어요.</p></div>`; return; }

  const scored = raters.map(rater => {
    const sel = rater.selections || {};
    let correct = 0, possible = 0;
    const rows = targets.map(m => {
      const answer = m.answer || {};
      const hasAnswer = AXES.every(ax => answer[ax.key]);
      const pick = sel[m.name] || {};
      let rowCorrect = 0;
      const cells = AXES.map(ax => {
        const p = pick[ax.key];
        const isCorrect = hasAnswer && p && p === answer[ax.key];
        if(hasAnswer && p && p !== 'pass'){ if(isCorrect) rowCorrect++; }
        return { picked: p || '-', correct: isCorrect, axis: ax.key };
      });
      if(hasAnswer){ correct += rowCorrect; possible += 4; }
      return { member: m.name, cells, rowCorrect, hasAnswer };
    });
    return { name: rater.name, correct, possible, rows };
  });
  scored.sort((a,b) => b.correct - a.correct);

  let html = `<div class="voter-count">참여(로그인) 멤버 수: ${raters.length} / ${targets.length}명 · 이름을 눌러 상세 예측을 펼쳐보세요</div>`;
  scored.forEach(s => {
    html += `<details class="card" style="padding:0;">
      <summary style="padding:16px 18px; cursor:pointer; font-weight:700; font-size:16px; display:flex; justify-content:space-between; align-items:center;">
        <span>${esc(s.name)}</span>
        <span style="font-family:'Bebas Neue','Pretendard',sans-serif; font-size:19px;">${s.correct} / ${s.possible} 정답</span>
      </summary>
      <div style="padding:0 18px 16px;">
        <table style="width:100%; border-collapse:collapse; font-size:13.5px;">
          <thead><tr style="text-align:left; color:var(--text-dim); border-bottom:1.5px solid #000;">
            <th style="padding:6px 4px;">멤버</th><th style="padding:6px 4px;">예측</th><th style="padding:6px 4px;">정답여부</th>
          </tr></thead>
          <tbody>`;
    s.rows.forEach(row => {
      const badge = !row.hasAnswer ? `<span style="color:var(--text-dim);">정답 미설정</span>`
        : `<span style="display:inline-block; font-weight:700; padding:2px 8px; border-radius:5px; ${row.rowCorrect===4 ? 'background:#000; color:#fff;' : 'background:#fff; color:#000; border:1.5px solid #000;'}">${row.rowCorrect} / 4</span>`;
      const predictedColored = row.cells.map(c => {
        if(!row.hasAnswer) return `<span style="font-weight:700;">${c.picked}</span>`;
        return c.correct
          ? `<span style="display:inline-block; min-width:18px; text-align:center; font-weight:700; background:#000; color:#fff; border-radius:4px; padding:1px 4px; margin-right:2px;">${c.picked}</span>`
          : `<span style="display:inline-block; min-width:18px; text-align:center; font-weight:700; background:#fff; color:#000; border:1.5px solid #000; border-radius:4px; padding:1px 4px; margin-right:2px;">${c.picked}</span>`;
      }).join('');
      html += `<tr style="border-bottom:1px solid var(--border);">
        <td style="padding:7px 4px;">${esc(row.member)}</td>
        <td style="padding:7px 4px; font-family:'JetBrains Mono',monospace;">${predictedColored}</td>
        <td style="padding:7px 4px;">${badge}</td>
      </tr>`;
    });
    html += `</tbody></table></div></details>`;
  });
  body.innerHTML = html;
}

// ---- 통계 (축별 집계 비율) ----
async function renderAdminStats(){
  const body = document.getElementById('adminBody');
  const r = await api('results', { password: adminPassword });
  if(r.error){ body.innerHTML = `<div class="center-msg"><p>오류: ${esc(r.error)}</p></div>`; return; }
  if(r.members.length === 0){ body.innerHTML = `<div class="center-msg"><p>등록된 멤버가 없어요.</p></div>`; return; }
  let html = `<div class="voter-count">참여 투표자 수: ${r.voterCount}명</div>`;
  r.members.forEach(m => {
    const name = m.name;
    const answer = m.answer || {};
    const votes = r.votes[name] || {};
    const hasFullAnswer = AXES.every(ax => answer[ax.key]);
    const majoritySummary = AXES.map(ax => {
      const v = votes[ax.key] || { [ax.a]:0, [ax.b]:0 };
      const a = v[ax.a] || 0, b = v[ax.b] || 0;
      const total = a + b;
      if(total === 0) return '-';
      if(a === b) return '<b style="font-weight:800; color:#DC2626;">X</b>';
      const majorityLetter = a > b ? ax.a : ax.b;
      if(!answer[ax.key]) return majorityLetter;
      return majorityLetter === answer[ax.key] ? majorityLetter : '<b style="font-weight:800; color:#DC2626;">X</b>';
    }).join('');
    html += `<div class="card"><div class="member-name" style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px;">
      <span>${esc(name)}</span>
      <span style="font-size:14px; font-family:'JetBrains Mono','Pretendard',monospace; color:var(--text-dim); font-weight:600;">정답 ${hasFullAnswer ? answerLabel(answer) : '미설정'} / 과반수 ${majoritySummary}</span>
    </div>`;
    AXES.forEach(ax => {
      const v = votes[ax.key] || { [ax.a]:0, [ax.b]:0 };
      const a = v[ax.a] || 0, b = v[ax.b] || 0;
      const total = a + b;
      const pctA = total > 0 ? Math.round((a/total)*100) : 0;
      const pctB = total > 0 ? 100 - pctA : 0;
      const correctLetter = answer[ax.key];
      const majorityLetter = total > 0 && a !== b ? (a > b ? ax.a : ax.b) : null;
      const hasAnswer = !!correctLetter;
      const isMajorityCorrect = hasAnswer && majorityLetter && majorityLetter === correctLetter;
      let matchBadge = '';
      if(hasAnswer && total > 0 && isMajorityCorrect){
        matchBadge = `<span style="font-weight:700; color:#fff; background:#000; padding:3px 9px; border-radius:5px; display:inline-block;">✓ 과반수 일치</span>`;
      } else if(!hasAnswer){
        matchBadge = `<span style="color:var(--text-dim);">정답 미설정</span>`;
      }
      const ringStyle = (hasAnswer && total > 0 && isMajorityCorrect)
        ? `border:2px solid #000; background:rgba(0,0,0,0.04);`
        : `border:1.5px solid transparent;`;
      const colorA = hasAnswer ? (correctLetter===ax.a ? '#2F6FED' : '#000') : '#000';
      const colorB = hasAnswer ? (correctLetter===ax.b ? '#2F6FED' : '#000') : '#000';
      html += `<div class="result-axis" style="border-radius:8px; padding:8px 10px; ${ringStyle}">
        <div class="result-labels">
          <span style="color:${colorA};">${ax.a}${correctLetter===ax.a?' (정답)':''} ${total>0?pctA+'%':''}</span>
          <span style="color:${colorB};">${ax.b}${correctLetter===ax.b?' (정답)':''} ${total>0?pctB+'%':''}</span>
        </div>
        <div class="bar">${total>0 ? `<div style="width:${pctA}%; background:${colorA};"></div><div style="width:${pctB}%; background:${colorB};"></div>` : `<div style="width:100%;"></div>`}</div>
        <div class="result-meta"><span>${a}표 · ${b}표</span>${matchBadge}</div>
      </div>`;
    });
    html += `</div>`;
  });
  body.innerHTML = html;
}

render();
</script>
</body>
</html>
