name = "ycc-ask"
main = "src/worker.js"
compatibility_date = "2026-08-02"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# wrangler kv namespace create YCC_KV 실행 후 나오는 id를 아래에 넣어주세요.
[[kv_namespaces]]
binding = "YCC_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true
